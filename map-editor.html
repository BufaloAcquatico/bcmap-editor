<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCMap Editor</title>
  <!-- Vendored third-party CSS (assets/vendor/, committed for offline use).
       No remote CDN references: the editor works with all network blocked. -->
  <link href="assets/vendor/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link href="assets/vendor/bootstrap-icons.css" rel="stylesheet" integrity="sha384-4LISF5TTJX/fLmGSxO53rV4miRxdg84mZsxmO8Rx5jGtp/LbrixFETvWa5a6sESd" crossorigin="anonymous">
  <style>
    :root {
      --bs-body-bg: #1a1a2e;
      --bs-body-color: #eaeaea;
      --bs-primary: #0d6efd;
      --bs-secondary: #6c757d;
      --motion-ms: 140ms; /* fallback; init.ts overwrites from src/anim.ts */
      --motion-quick-ms: 100ms; /* fallback; init.ts overwrites from src/anim.ts */
    }
    /* Motion tokens: one duration family for DOM transitions (canvas
       loops mirror the rhythm in src/anim.ts). Smooth scroll stays
       scoped to the picker pane; reduced motion snaps all of it. */
    #sidebarContent { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      /* NOTE: intentionally `none`, not the common 0.01ms snippet:
         sub-millisecond durations freeze outline-color transitions at
         their start value in Chromium (verified), while nothing here
         listens for CSS transition events that `none` would suppress. */
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
        scroll-behavior: auto !important;
      }
    }
    html, body { height: 100%; margin: 0; padding: 0; }
    body { 
      background-color: var(--bs-body-bg); 
      color: var(--bs-body-color); 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
      overflow: hidden;
    }
    .sidebar { background-color: #16213e; border-right: 1px solid #2a2a4a; }
    .map-panel { background-color: #0f0f23; flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .btn-toolbar .btn { border-radius: 0.375rem; }
    .category-header { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 0.5rem; border: 1px solid #2a2a4a; transition: background-color var(--motion-ms) ease-out, outline-color var(--motion-ms) ease-out; outline: 2px solid transparent; outline-offset: -2px; }
    .category-content + .category-header { margin-top: -1px; }
    .category-header:hover { background-color: #2a2a4a; }
    /* Picker nodes are real <button>s (F3): strip UA button chrome so the
       existing div-era styling above still applies unchanged. */
    button.category-header,
    button.sprite-item {
      appearance: none;
      padding: 0;
      font: inherit;
      color: inherit;
      background-color: transparent;
      text-align: left;
    }
    button.sprite-item { display: inline-block; }
    button.category-header { width: 100%; }
    .category-caret { font-size: 0.75rem; transition: transform var(--motion-ms) ease-out; }
    .category-caret.expanded { transform: rotate(90deg); }
    .category-content { display: flex; flex-wrap: wrap; }
    .sprite-item { 
      display: inline-block; 
      width: 48px; 
      height: 48px; 
      margin: 2px; 
      border: 2px solid transparent; 
      border-radius: 4px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      cursor: pointer;
      transition: border-color var(--motion-ms) ease-out, box-shadow var(--motion-ms) ease-out, outline-color var(--motion-ms) ease-out;
      outline: 2px solid transparent;
      outline-offset: 1px;
    }
    .sprite-item:hover { border-color: #6c757d; }
    /* Selected wins over hover on equal specificity: the brush stays
       white even with the mouse resting on it. Focus outranks both. */
    .sprite-item.selected { border-color: rgba(255, 255, 255, 0.9); box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.5); }
    /* Keyboard focus must always be visible: one ring in the picker grid. */
    button.sprite-item:focus-visible,
    button.sprite-item:focus {
      outline: 2px solid rgba(255, 255, 255, 0.9);
      outline-offset: 1px;
      border-color: rgba(255, 255, 255, 0.9);
    }
    button.category-header:focus-visible,
    button.category-header:focus {
      outline: 2px solid rgba(255, 255, 255, 0.9);
      outline-offset: -2px;
      background-color: #2a2a4a;
    }

    #mapCanvas { 
      display: block; 
      cursor: crosshair; 
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 100%;
      height: 100%;
      flex: 1;
    }
    /* The gold vim cursor already signals canvas focus (it draws exactly
       while the tracked surface is the map), so the browser default ring
       would only add a flicker: absent on mouse-click focus, popping in
       on programmatic focus after keyboard use. Keep it off, both ways. */
    #mapCanvas:focus,
    #mapCanvas:focus-visible {
      outline: none;
    }
    .toolbar { background-color: #16213e; border-bottom: 1px solid #2a2a4a; }
    .status-bar { background-color: #16213e; border-top: 1px solid #2a2a4a; font-size: 0.875rem; }
    /* Vim-style command line: a `:` glyph plus typed text in status-bar
       typography, so opening it shifts no pixels and shows no box chrome.
       (`d-none` still hides the wrap; this rule only lays it out shown.) */
    #commandPromptWrap { display: flex; align-items: center; min-width: 0; }
    #commandPromptPrefix { flex: none; }
    #commandPrompt {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
      padding: 0;
      font: inherit;
      color: inherit;
    }
    #commandPrompt:focus { outline: none; box-shadow: none; }
    .modal-content { background-color: #1a1a2e; color: #eaeaea; border: 1px solid #2a2a4a; }
    .modal-header, .modal-footer { border-color: #2a2a4a; }
    .form-control, .form-select { background-color: #0f0f23; border-color: #2a2a4a; color: #eaeaea; }
    .form-control:focus, .form-select:focus { background-color: #0f0f23; border-color: #0d6efd; color: #eaeaea; box-shadow: 0 0 0 0.25rem rgba(13,110,253,0.25); }
    .search-box { width: 100%; }
    .layer-tabs { border-bottom: 1px solid #2a2a4a; }
    .layer-tabs .nav-link { color: #adb5bd; cursor: pointer; flex: 1; text-align: center; white-space: nowrap; }
    .layer-tabs .nav-link:hover { color: #fff; }
    .layer-tabs .btn-check:checked + .nav-link { background-color: #fff; color: #16213e; border-color: transparent; }
    .layer-tabs .nav-link.active { background-color: #fff; color: #16213e; }
.zoom-display { min-width: 80px; text-align: center; }
    .controls-help {
      position: absolute;
      right: 12px;
      bottom: 12px;
      padding: 8px 12px;
      background: rgba(22, 33, 62, 0.85);
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      font-size: 0.75rem;
      line-height: 1.6;
      color: #cfd3dc;
      pointer-events: none;
      max-width: 300px;
    }
    .controls-help .controls-help-title { font-weight: 600; color: #fff; margin-bottom: 4px; }
    .controls-help .help-surface-label { font-weight: 600; color: #fff; margin-bottom: 4px; }
    .controls-help .help-sections {
      display: grid;
      grid-template-columns: auto 1fr;
      column-gap: 8px;
      row-gap: 1px;
      align-items: baseline;
    }
    .controls-help .help-section-label {
      grid-column: 1 / -1;
      color: #8ea2ff;
      font-weight: 600;
      margin-top: 4px;
    }
    .controls-help .help-section-label:first-child { margin-top: 0; }
    .controls-help .help-keys { white-space: nowrap; text-align: right; }
    .controls-help .help-desc { min-width: 0; }
    .controls-help kbd {
      background: #0f0f23;
      border: 1px solid #2a2a4a;
      border-radius: 3px;
      padding: 0 4px;
      color: #eaeaea;
      font-size: 0.7rem;
    }
  </style>
</head>
<body>
  <!-- Top Toolbar -->
  <div class="toolbar p-2 d-flex justify-content-between align-items-center">
    <div class="d-flex gap-2">
      <button id="btnNew" class="btn btn-sm btn-outline-light" title="New Map"><i class="bi bi-file-earmark-plus"></i></button>
      <button id="btnImport" class="btn btn-sm btn-outline-light" title="Import Map"><i class="bi bi-upload"></i></button>
      <button id="btnExport" class="btn btn-sm btn-outline-light" title="Export Map"><i class="bi bi-download"></i></button>
      <button id="btnUndo" class="btn btn-sm btn-outline-light" title="Undo (Ctrl+Z)" disabled><i class="bi bi-arrow-counterclockwise"></i></button>
      <button id="btnRedo" class="btn btn-sm btn-outline-light" title="Redo (Ctrl+Y)" disabled><i class="bi bi-arrow-clockwise"></i></button>
    </div>
    <div class="d-flex gap-2 align-items-center">
      <div class="zoom-display text-light">
        Zoom: <span id="zoomLevel">100%</span>
      </div>
      <button id="btnZoomIn" class="btn btn-sm btn-outline-light" title="Zoom In"><i class="bi bi-zoom-in"></i></button>
      <button id="btnZoomOut" class="btn btn-sm btn-outline-light" title="Zoom Out"><i class="bi bi-zoom-out"></i></button>
      <button id="btnZoomReset" class="btn btn-sm btn-outline-light" title="Reset Zoom"><i class="bi bi-arrows-fullscreen"></i></button>
      <button id="btnToggleGrid" class="btn btn-sm btn-outline-light active" title="Toggle Grid (G)"><i class="bi bi-grid"></i></button>
    </div>
  </div>

  <!-- Main Layout -->
  <div class="flex-1 d-flex" style="flex: 1; min-height: 0; overflow: hidden;">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar d-flex flex-column" style="width: 320px; min-width: 320px; max-width: 400px; overflow: hidden;">
      <div class="nav nav-tabs layer-tabs px-2 pt-2">
        <input type="radio" class="btn-check" name="layer" id="layerTile" value="tile" checked autocomplete="off">
        <label class="nav-link" for="layerTile" title="Tile Layer"><i class="bi bi-grid-3x3-gap"></i> Tile</label>
        <input type="radio" class="btn-check" name="layer" id="layerObject" value="object" autocomplete="off">
        <label class="nav-link" for="layerObject" title="Object Layer"><i class="bi bi-box"></i> Object</label>
      </div>
      <div class="p-2 border-bottom border-secondary">
        <div class="input-group input-group-sm">
          <span class="input-group-text bg-transparent border-secondary text-light"><i class="bi bi-search"></i></span>
          <input type="text" id="searchInput" class="form-control search-box bg-dark border-secondary text-light" placeholder="Search tiles/objects... (/ · Enter → results · Tab → map)" aria-label="Search tiles and objects">
        </div>
      </div>
      <div class="flex-1 overflow-auto" id="sidebarContent">
        <!-- Tile Picker Sections -->
        <div id="tileCategories"></div>
        <!-- Object Picker Sections -->
        <div id="objectCategories"></div>
      </div>
    </aside>

    <!-- Map Panel -->
    <main class="map-panel flex-1 d-flex flex-column position-relative" style="min-width: 0; min-height: 0;">
      <canvas id="mapCanvas" tabindex="0" role="application" aria-label="Map canvas, 40 by 40 grid"></canvas>
      <div id="controlsHelp" class="controls-help">
        <div class="controls-help-title">Controls</div>
        <!-- keyboard rows are rendered from the keybind registry by init.ts -->
      </div>
    </main>
  </div>

  <!-- Status Bar -->
  <div class="status-bar p-2 d-flex justify-content-between align-items-center gap-2">
    <div class="flex-1" style="min-width: 0;">
      <div id="statusVimMode" role="status" aria-live="polite">-- NORMAL --</div>
      <span id="commandPromptWrap" class="d-none w-100"><span id="commandPromptPrefix" aria-hidden="true">:</span><input id="commandPrompt" type="text" aria-label="Command prompt" autocomplete="off" spellcheck="false"></span>
    </div>
    <div id="statusSelection">No selection</div>
    <div id="statusPosition">Position: (-, -)</div>
  </div>

  <!-- Import Modal -->
  <div class="modal fade" id="importModal" tabindex="-1" role="dialog" aria-modal="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-upload"></i> Import Map</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="importCode" class="form-label">Paste Map Code (LZString compressed)</label>
            <textarea id="importCode" class="form-control" rows="8" style="font-family: monospace; font-size: 0.75rem;"></textarea>
          </div>
</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="btnImportConfirm"><i class="bi bi-check"></i> Import</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Export Modal -->
  <div class="modal fade" id="exportModal" tabindex="-1" role="dialog" aria-modal="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-download"></i> Export Map</h5>
          <button type="button" class class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="exportName" class="form-label">Map Name</label>
            <input type="text" id="exportName" class="form-control" value="my-map" placeholder="Enter map name">
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="exportIncludeObjects" checked>
            <label class="form-check-label" for="exportIncludeObjects">Include objects</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="btnExportConfirm"><i class="bi bi-check"></i> Export</button>
        </div>
      </div>
    </div>
  </div>

  <!-- New Map Confirmation Modal -->
  <div class="modal fade" id="newMapModal" tabindex="-1" role="dialog" aria-modal="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-file-earmark-plus"></i> New Map</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>Create a new map? This will replace the current map with a default grass field.</p>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="newMapConfirm" required>
            <label class="form-check-label" for="newMapConfirm">I understand this will discard unsaved changes</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="btnNewConfirm" disabled><i class="bi bi-trash"></i> Create New</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts (vendored; see head comment) -->
  <script src="assets/vendor/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

"use strict";
// BCMap Editor - shared game-data constants (Bondage Club R132).
//
// Used by both the editor runtime (src/editor.ts, bundled into
// map-editor.html by scripts/embed-js.js) and scripts/download-assets.ts.
// Kept here rather than in catalog.ts because catalog.ts is generated
// verbatim game data ("do not edit by hand") while these are hand-written
// derivations of BC's BuildImageName / WallEffect rules. A single source
// keeps the runtime preloader and the asset downloader from drifting apart.
window.RAILROAD_DIRECTIONS = window.WALL_EFFECT_INDICES = void 0;
window.railroadVariantStyles = railroadVariantStyles;
/** WallEffect sprite indices served by the game server (0-21, 50-53). */
window.WALL_EFFECT_INDICES = [
    ...Array.from({ length: 22 }, (_, i) => i),
    50,
    51,
    52,
    53,
];
/**
 * Compass directions used to build Railroad connectivity suffixes
 * ("Railroad", "RailroadNorth", "RailroadNorthSouth", ...).
 * Order is significant: bit position in the 4-bit neighbor mask.
 */
window.RAILROAD_DIRECTIONS = ["North", "South", "East", "West"];
/** All 16 Railroad variant style names ("Railroad" + N/S/E/W suffixes). */
function railroadVariantStyles() {
    const styles = [];
    for (let mask = 0; mask < 16; mask++) {
        let suffix = "";
        window.RAILROAD_DIRECTIONS.forEach((dir, b) => {
            if (mask & (1 << b))
                suffix += dir;
        });
        styles.push("Railroad" + suffix);
    }
    return styles;
}

"use strict";
// BCMap Editor - context-sensitive help card.
//
// Renders the help overlay from the keybind registry: only the current
// surface's slice, plus mouse rows, with a toggle for the full list.
// Rows still derive from the registry so card, README and dispatcher
// cannot drift; per-surface selection is by registry key, never
// hand-maintained text. Command/chrome surfaces have no dispatcher
// bindings, so their rows are tiny static lists — plus, on command, the
// full `:` command registry. Visual selections
// survive surface changes: off-map surfaces carry a reminder while a
// region is open.
window.SURFACE_HELP_KEYS = window.GROUP_LABELS = window.GROUP_ORDER = void 0;
window.createHelpRenderer = createHelpRenderer;
const anim_1 = window;
const MOUSE_HELP_ROWS = [
    ["Left click / drag", "Paint tiles or objects"],
    ["Right drag", "Move the view"],
    ["Wheel", "Zoom"],
];
/** Display order for help sections; also drives the README table. */
window.GROUP_ORDER = [
    "mouse",
    "cursor",
    "paint",
    "clipboard",
    "navigate",
    "command",
    "system",
];
window.GROUP_LABELS = {
    mouse: "Mouse",
    cursor: "Cursor",
    paint: "Paint",
    clipboard: "Clipboard",
    navigate: "Navigate",
    command: "Command",
    system: "System",
};
const SURFACE_LABELS = {
    map: "Map keys",
    picker: "Sidebar keys",
    search: "Search keys",
    command: "Command line",
    chrome: "Popup",
};
/** Registry keys shown per surface; every entry must resolve in KEYBIND_HELP. */
window.SURFACE_HELP_KEYS = {
    map: [
        "hjkl / arrows",
        "Space / Enter",
        "v",
        "y / Y",
        "p",
        "u",
        "/",
        ":",
        "Tab",
        "?",
        "+ / =",
        "-",
        "Esc",
    ],
    picker: ["arrows", "Enter", "Tab", "/", "Esc", "?"],
    search: ["Enter", "Tab", "Esc", "?"],
    command: [],
    chrome: [],
};
const COMMAND_HELP_ROWS = [
    ["Enter", "Run what you typed", "command"],
    ["Esc", "Cancel and go back to the map", "system"],
    ["Up / Down", "Show earlier commands", "system"],
];
function createHelpRenderer(deps) {
    const entryByKeys = new Map(deps.registry.map((entry) => [entry.keys, entry]));
    let showAll = false;
    let nodes = [];
    const clearRows = () => {
        nodes.forEach((node) => node.remove());
        nodes = [];
    };
    const formatKeys = (keys) => {
        // A bare "/" must not be split into "" + "": it is the key itself.
        if (keys.trim() === "/")
            return "<kbd>/</kbd>";
        return keys
            .split("/")
            .map((k) => k.trim())
            .filter((k) => k.length > 0)
            .map((k) => `<kbd>${k}</kbd>`)
            .join(" / ");
    };
    // One shared grid wrapper aligns the key column across every
    // section; labels span the full row. Rows are key/desc span pairs
    // appended straight into it (never nested), so alignment holds.
    const render = () => {
        clearRows();
        const surface = deps.getSurface();
        const byGroup = new Map();
        const push = (group, keys, text) => {
            const list = byGroup.get(group) ?? [];
            list.push({ keys, text });
            byGroup.set(group, list);
        };
        const pushEntry = (keys) => {
            const entry = entryByKeys.get(keys);
            if (entry)
                push(entry.group, entry.keys, entry.description);
        };
        MOUSE_HELP_ROWS.forEach(([keys, text]) => push("mouse", keys, text));
        if (showAll) {
            deps.registry.forEach((entry) => push(entry.group, entry.keys, entry.description));
        }
        else if (surface === "command") {
            COMMAND_HELP_ROWS.forEach(([keys, text, group]) => push(group, keys, text));
            deps.commands.forEach((command) => push("command", command.syntax, command.description));
        }
        else if (surface === "chrome") {
            push("system", "Esc", "Close and go back to the map");
        }
        else {
            window.SURFACE_HELP_KEYS[surface].forEach(pushEntry);
        }
        const label = deps.createElement("div");
        label.className = "help-surface-label";
        label.textContent = showAll ? "All keys" : SURFACE_LABELS[surface];
        deps.card.appendChild(label);
        nodes.push(label);
        const grid = deps.createElement("div");
        grid.className = "help-sections";
        for (const group of window.GROUP_ORDER) {
            const items = byGroup.get(group);
            if (!items || items.length === 0)
                continue;
            const heading = deps.createElement("div");
            heading.className = "help-section-label";
            heading.textContent = window.GROUP_LABELS[group];
            grid.appendChild(heading);
            for (const item of items) {
                const keysEl = deps.createElement("span");
                keysEl.className = "help-keys";
                keysEl.innerHTML = formatKeys(item.keys);
                const textEl = deps.createElement("span");
                textEl.className = "help-desc";
                textEl.textContent = item.text;
                grid.appendChild(keysEl);
                grid.appendChild(textEl);
            }
        }
        deps.card.appendChild(grid);
        nodes.push(grid);
        if (surface !== "map" && deps.isVisualActive()) {
            const note = deps.createElement("div");
            note.textContent =
                "Your selection is kept — go back to the map to use it";
            note.style.color = "#ffd479";
            deps.card.appendChild(note);
            nodes.push(note);
        }
        // The card itself is pointer-transparent so it never blocks the
        // canvas; only this toggle accepts pointer input.
        const toggle = deps.createElement("button");
        toggle.type = "button";
        toggle.textContent = showAll
            ? "Show keys for this screen"
            : `Show all keys (${deps.registry.length})`;
        toggle.style.pointerEvents = "auto";
        toggle.style.cursor = "pointer";
        toggle.style.background = "none";
        toggle.style.border = "none";
        toggle.style.padding = "0";
        toggle.style.font = "inherit";
        toggle.style.fontSize = "inherit";
        toggle.style.color = "#8ea2ff";
        toggle.style.textDecoration = "underline";
        toggle.addEventListener("click", () => setShowAll(!showAll));
        deps.card.appendChild(toggle);
        nodes.push(toggle);
    };
    const setShowAll = (show) => {
        showAll = show;
        render();
        (0, anim_1.fadeIn)(deps.card);
    };
    // The card breathes on every reslice; the toggle path above
    // re-renders first, so wrapping render would double-fade it.
    const renderAndBreathe = () => {
        render();
        (0, anim_1.fadeIn)(deps.card);
    };
    return { render: renderAndBreathe, setShowAll };
}
