<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCMap Editor</title>
  <!-- Bootstrap 5 Dark Mode CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --bs-body-bg: #1a1a2e;
      --bs-body-color: #eaeaea;
      --bs-primary: #0d6efd;
      --bs-secondary: #6c757d;
    }
    html, body { height: 100%; margin: 0; padding: 0; }
    body { 
      background-color: var(--bs-body-bg); 
      color: var(--bs-body-color); 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
      overflow: hidden;
    }
    .sidebar { background-color: #16213e; border-right: 1px solid #2a2a4a; }
    .map-panel { background-color: #0f0f23; flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .btn-toolbar .btn { border-radius: 0.375rem; }
    .category-header { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 0.5rem; }
    .category-header:hover { background-color: #2a2a4a; }
    .category-caret { font-size: 0.75rem; transition: transform 0.15s ease; }
    .category-caret.expanded { transform: rotate(90deg); }
    .category-content { display: flex; flex-wrap: wrap; }
    .sprite-item { 
      display: inline-block; 
      width: 48px; 
      height: 48px; 
      margin: 2px; 
      border: 2px solid transparent; 
      border-radius: 4px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      cursor: pointer;
    }
    .sprite-item.selected { border-color: #0d6efd; box-shadow: 0 0 0 2px rgba(13,110,253,0.5); }
    .sprite-item:hover { border-color: #6c757d; }

    #mapCanvas { 
      display: block; 
      cursor: crosshair; 
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 100%;
      height: 100%;
      flex: 1;
    }
    .toolbar { background-color: #16213e; border-bottom: 1px solid #2a2a4a; }
    .status-bar { background-color: #16213e; border-top: 1px solid #2a2a4a; font-size: 0.875rem; }
    .modal-content { background-color: #1a1a2e; color: #eaeaea; border: 1px solid #2a2a4a; }
    .modal-header, .modal-footer { border-color: #2a2a4a; }
    .form-control, .form-select { background-color: #0f0f23; border-color: #2a2a4a; color: #eaeaea; }
    .form-control:focus, .form-select:focus { background-color: #0f0f23; border-color: #0d6efd; color: #eaeaea; box-shadow: 0 0 0 0.25rem rgba(13,110,253,0.25); }
    .search-box { width: 100%; }
    .layer-tabs { border-bottom: 1px solid #2a2a4a; }
    .layer-tabs .nav-link { color: #adb5bd; cursor: pointer; flex: 1; text-align: center; white-space: nowrap; }
    .layer-tabs .nav-link:hover { color: #fff; }
    .layer-tabs .btn-check:checked + .nav-link { background-color: #fff; color: #16213e; border-color: transparent; }
    .layer-tabs .nav-link.active { background-color: #fff; color: #16213e; }
.zoom-display { min-width: 80px; text-align: center; }
    .controls-help {
      position: absolute;
      right: 12px;
      bottom: 12px;
      padding: 8px 12px;
      background: rgba(22, 33, 62, 0.85);
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      font-size: 0.75rem;
      line-height: 1.6;
      color: #cfd3dc;
      pointer-events: none;
      max-width: 260px;
    }
    .controls-help .controls-help-title { font-weight: 600; color: #fff; margin-bottom: 4px; }
    .controls-help kbd {
      background: #0f0f23;
      border: 1px solid #2a2a4a;
      border-radius: 3px;
      padding: 0 4px;
      color: #eaeaea;
      font-size: 0.7rem;
    }
  </style>
</head>
<body>
  <!-- Top Toolbar -->
  <div class="toolbar p-2 d-flex justify-content-between align-items-center">
    <div class="d-flex gap-2">
      <button id="btnNew" class="btn btn-sm btn-outline-light" title="New Map"><i class="bi bi-file-earmark-plus"></i></button>
      <button id="btnImport" class="btn btn-sm btn-outline-light" title="Import Map"><i class="bi bi-upload"></i></button>
      <button id="btnExport" class="btn btn-sm btn-outline-light" title="Export Map"><i class="bi bi-download"></i></button>
      <button id="btnUndo" class="btn btn-sm btn-outline-light" title="Undo (Ctrl+Z)" disabled><i class="bi bi-arrow-counterclockwise"></i></button>
      <button id="btnRedo" class="btn btn-sm btn-outline-light" title="Redo (Ctrl+Y)" disabled><i class="bi bi-arrow-clockwise"></i></button>
    </div>
    <div class="d-flex gap-2 align-items-center">
      <div class="zoom-display text-light">
        Zoom: <span id="zoomLevel">100%</span>
      </div>
      <button id="btnZoomIn" class="btn btn-sm btn-outline-light" title="Zoom In"><i class="bi bi-zoom-in"></i></button>
      <button id="btnZoomOut" class="btn btn-sm btn-outline-light" title="Zoom Out"><i class="bi bi-zoom-out"></i></button>
      <button id="btnZoomReset" class="btn btn-sm btn-outline-light" title="Reset Zoom"><i class="bi bi-arrows-fullscreen"></i></button>
      <button id="btnToggleGrid" class="btn btn-sm btn-outline-light active" title="Toggle Grid (G)"><i class="bi bi-grid"></i></button>
    </div>
  </div>

  <!-- Main Layout -->
  <div class="flex-1 d-flex" style="flex: 1; min-height: 0; overflow: hidden;">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar d-flex flex-column" style="width: 320px; min-width: 320px; max-width: 400px; overflow: hidden;">
      <div class="nav nav-tabs layer-tabs px-2 pt-2">
        <input type="radio" class="btn-check" name="layer" id="layerTile" value="tile" checked autocomplete="off">
        <label class="nav-link" for="layerTile" title="Tile Layer"><i class="bi bi-grid-3x3-gap"></i> Tile</label>
        <input type="radio" class="btn-check" name="layer" id="layerObject" value="object" autocomplete="off">
        <label class="nav-link" for="layerObject" title="Object Layer"><i class="bi bi-box"></i> Object</label>
      </div>
      <div class="p-2 border-bottom border-secondary">
        <div class="input-group input-group-sm">
          <span class="input-group-text bg-transparent border-secondary text-light"><i class="bi bi-search"></i></span>
          <input type="text" id="searchInput" class="form-control search-box bg-dark border-secondary text-light" placeholder="Search tiles/objects...">
        </div>
      </div>
      <div class="flex-1 overflow-auto" id="sidebarContent">
        <!-- Tile Picker Sections -->
        <div id="tileCategories"></div>
        <!-- Object Picker Sections -->
        <div id="objectCategories"></div>
      </div>
    </aside>

    <!-- Map Panel -->
    <main class="map-panel flex-1 d-flex flex-column position-relative" style="min-width: 0; min-height: 0;">
      <canvas id="mapCanvas"></canvas>
      <div id="controlsHelp" class="controls-help">
        <div class="controls-help-title">Controls</div>
        <div><kbd>?</kbd> &mdash; toggle help</div>
        <div><kbd>Left click</kbd> / <kbd>drag</kbd> &mdash; paint</div>
        <div><kbd>Right drag</kbd> &mdash; pan</div>
        <div><kbd>Wheel</kbd> &mdash; zoom</div>
        <div><kbd>G</kbd> &mdash; toggle grid</div>
        <div><kbd>Ctrl</kbd> + <kbd>Z</kbd> &mdash; undo</div>
        <div><kbd>Ctrl</kbd> + <kbd>Y</kbd> &mdash; redo</div>
      </div>
    </main>
  </div>

  <!-- Status Bar -->
  <div class="status-bar p-2 d-flex justify-content-between align-items-center">
    <div id="statusPosition">Position: (-, -)</div>
    <div id="statusSelection">No selection</div>
    <div id="statusMapSize">Map: 40x40</div>
  </div>

  <!-- Import Modal -->
  <div class="modal fade" id="importModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-upload"></i> Import Map</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="importCode" class="form-label">Paste Map Code (LZString compressed)</label>
            <textarea id="importCode" class="form-control" rows="8" style="font-family: monospace; font-size: 0.75rem;"></textarea>
          </div>
</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="btnImportConfirm"><i class="bi bi-check"></i> Import</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Export Modal -->
  <div class="modal fade" id="exportModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-download"></i> Export Map</h5>
          <button type="button" class class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="exportName" class="form-label">Map Name</label>
            <input type="text" id="exportName" class="form-control" value="my-map" placeholder="Enter map name">
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="exportIncludeObjects" checked>
            <label class="form-check-label" for="exportIncludeObjects">Include objects</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="btnExportConfirm"><i class="bi bi-check"></i> Export</button>
        </div>
      </div>
    </div>
  </div>

  <!-- New Map Confirmation Modal -->
  <div class="modal fade" id="newMapModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-file-earmark-plus"></i> New Map</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>Create a new map? This will replace the current map with a default grass field.</p>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="newMapConfirm" required>
            <label class="form-check-label" for="newMapConfirm">I understand this will discard unsaved changes</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="btnNewConfirm" disabled><i class="bi bi-trash"></i> Create New</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->

        const objectCategories = document.getElementById("objectCategories");
        if (!tileCategories || !objectCategories)
            return;
        this.tileCategoryEls = [];
        this.objectCategoryEls = [];
        this.tilePickerItemById.clear();
        this.objectPickerItemById.clear();
        const tileGroups = new Map();
        this.tileCatalog.forEach((t) => {
            if (!tileGroups.has(t.Type))
                tileGroups.set(t.Type, []);
            tileGroups.get(t.Type).push(t);
        });
        tileCategories.innerHTML = "";
        tileGroups.forEach((tiles, type) => {
            const { header, entry } = this.createCategoryHeader(type);
            this.tileCategoryEls.push(entry);
            const container = entry.content;
            tiles.forEach((tile) => {
                const item = document.createElement("div");
                item.className = "sprite-item";
                const key = tile.Type + "/" + tile.Style;
                item.style.backgroundImage =
                    "url(assets/tiles/" + key + ".png)";
                item.title = tile.Style;
                item.addEventListener("click", () => {
                    this.setSelectedTile(tile);
                });
                container.appendChild(item);
                this.tilePickerItemById.set(tile.ID, item);
            });
            tileCategories.appendChild(header);
            tileCategories.appendChild(container);
        });
        const objGroups = new Map();
        this.objectCatalog.forEach((o) => {
            let g = o.Type;
            if (o.Type.startsWith("FloorDecoration"))
                g = "Floor Decorations";
            else if (o.Type === "FloorItem" ||
                o.Type === "FloorNumber" ||
                o.Type === "FloorLetter" ||
                o.Type === "FloorIcon")
                g = "Floor Items";
            else if (o.Type === "FloorObstacle")
                g = "Floor Obstacles";
            else if (o.Type === "WallDecoration" || o.Type === "WallPath")
                g = "Wall";
            else if (o.Type === "Banners")
                g = "Banners";
            if (!objGroups.has(g))
                objGroups.set(g, []);
            objGroups.get(g).push(o);
        });
        objectCategories.innerHTML = "";
        objGroups.forEach((objs, group) => {
            const { header, entry } = this.createCategoryHeader(group);
            this.objectCategoryEls.push(entry);
            const container = entry.content;
            let blankAdded = false;
            objs.forEach((obj) => {
                if (obj.Style === "Blank") {
                    if (blankAdded) {
                        return;
                    }
                    blankAdded = true;
                }
                const item = document.createElement("div");
                item.className = "sprite-item";
                if (obj.Style !== "Blank") {
                    const key = obj.Type + "/" + obj.Style;
                    item.style.backgroundImage =
                        "url(assets/objects/" + key + ".png)";
                    item.title = obj.Style;
                }
                else {
                    item.innerHTML = BLANK_ERASER_ICON;
                    item.title = "Blank (Erase)";
                }
                item.addEventListener("click", () => {
                    this.setSelectedObject(obj);
                });
                container.appendChild(item);
                this.objectPickerItemById.set(obj.ID, item);
            });
            objectCategories.appendChild(header);
            objectCategories.appendChild(container);
        });
        this.tileCategoryEls.forEach((entry) => this.setCategoryCollapsed(entry, true));
        this.objectCategoryEls.forEach((entry) => this.setCategoryCollapsed(entry, true));
        this.updatePickerVisibility();
        this.syncPickerSelection();
    }
    updatePickerVisibility() {
        const tileCategories = document.getElementById("tileCategories");
        const objectCategories = document.getElementById("objectCategories");
        if (!tileCategories || !objectCategories)
            return;
        if (this.currentLayer === "tile") {
            tileCategories.style.display = "";
            objectCategories.style.display = "none";
        }
        else {
            tileCategories.style.display = "none";
            objectCategories.style.display = "";
        }
    }
    getTileCatalog() {
        return this.tileCatalog;
    }
    getObjectCatalog() {
        return this.objectCatalog;
    }
    getFullTileCatalog() {
        return catalog_1.FULL_TILE_CATALOG;
    }
    getFullObjectCatalog() {
        return catalog_1.FULL_OBJECT_CATALOG;
    }
    isKnownObjectId(id) {
        return this.fullObjectMap.has(id);
    }
    isKnownTileId(id) {
        return this.fullTileMap.has(id);
    }
    getCurrentLayer() {
        return this.currentLayer;
    }
}
window.BCMapEditor = BCMapEditor;

"use strict";
document.addEventListener("DOMContentLoaded", () => {
    const editor = new window.BCMapEditor("mapCanvas");
    // Store editor globally
    window.editor = editor;
    editor.populatePickers();
    // Layer toggle
    const layerRadios = document.querySelectorAll('input[name="layer"]');
    layerRadios.forEach((radio) => {
        radio.addEventListener("change", (e) => {
            const target = e.target;
            if (target.checked) {
                editor.setCurrentLayer(target.value);
            }
        });
    });
    // New map
    const btnNew = document.getElementById("btnNew");
    const newMapModal = new bootstrap.Modal(document.getElementById("newMapModal"));
    const newMapConfirm = document.getElementById("newMapConfirm");
    const btnNewConfirm = document.getElementById("btnNewConfirm");
    btnNew?.addEventListener("click", () => {
        newMapModal.show();
    });
    newMapConfirm?.addEventListener("change", () => {
        btnNewConfirm.disabled = !newMapConfirm.checked;
    });
    btnNewConfirm?.addEventListener("click", () => {
        editor.newMap();
        newMapModal.hide();
        newMapConfirm.checked = false;
        btnNewConfirm.disabled = true;
    });
    // Import
    const btnImport = document.getElementById("btnImport");
    const importModal = new bootstrap.Modal(document.getElementById("importModal"));
    btnImport?.addEventListener("click", () => {
        importModal.show();
    });
    const btnImportConfirm = document.getElementById("btnImportConfirm");
    const importCode = document.getElementById("importCode");
    btnImportConfirm?.addEventListener("click", () => {
        try {
            editor.importMap(importCode.value);
            importModal.hide();
            importCode.value = "";
        }
        catch (e) {
            alert(e.message);
        }
    });
    // Export
    const btnExport = document.getElementById("btnExport");
    const exportModal = new bootstrap.Modal(document.getElementById("exportModal"));
    btnExport?.addEventListener("click", () => {
        exportModal.show();
    });
    const btnExportConfirm = document.getElementById("btnExportConfirm");
    const exportName = document.getElementById("exportName");
    btnExportConfirm?.addEventListener("click", () => {
        try {
            const code = editor.exportMap(exportName.value || "my-map");
            const blob = new Blob([code], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            try {
                const a = document.createElement("a");
                a.href = url;
                a.download = `${exportName.value || "my-map"}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
            finally {
                URL.revokeObjectURL(url);
            }
            exportModal.hide();
        }
        catch (e) {
            alert(e.message);
        }
    });
    // Zoom controls
    const btnZoomIn = document.getElementById("btnZoomIn");
    const btnZoomOut = document.getElementById("btnZoomOut");
    const btnZoomReset = document.getElementById("btnZoomReset");
    btnZoomIn?.addEventListener("click", () => {
        editor.setZoom(editor.zoom * 1.1);
    });
    btnZoomOut?.addEventListener("click", () => {
        editor.setZoom(editor.zoom * 0.9);
    });
    btnZoomReset?.addEventListener("click", () => {
        editor.resetView();
    });
    // Search
    const searchInput = document.getElementById("searchInput");
    searchInput?.addEventListener("input", () => {
        editor.filterPickers(searchInput.value);
    });
    // Grid toggle (button + G keybind)
    const btnToggleGrid = document.getElementById("btnToggleGrid");
    const syncGridButton = () => {
        btnToggleGrid?.classList.toggle("active", editor.getGridVisible());
    };
    btnToggleGrid?.addEventListener("click", () => {
        editor.toggleGrid();
        syncGridButton();
    });
    window.addEventListener("keydown", (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey)
            return;
        if (e.key.toLowerCase() !== "g")
            return;
        const target = e.target;
        const tag = target?.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || target?.isContentEditable)
            return;
        e.preventDefault();
        editor.toggleGrid();
        syncGridButton();
    });
    // Help toggle (?) keybind
    window.addEventListener("keydown", (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey)
            return;
        if (e.key !== "?")
            return;
        const target = e.target;
        const tag = target?.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || target?.isContentEditable)
            return;
        e.preventDefault();
        editor.toggleHelp();
    });
    // Undo/Redo (buttons + keybinds)
    const btnUndo = document.getElementById("btnUndo");
    const btnRedo = document.getElementById("btnRedo");
    const syncHistoryButtons = () => {
        if (btnUndo)
            btnUndo.disabled = !editor.canUndo();
        if (btnRedo)
            btnRedo.disabled = !editor.canRedo();
    };
    btnUndo?.addEventListener("click", () => {
        editor.undo();
    });
    btnRedo?.addEventListener("click", () => {
        editor.redo();
    });
    editor.onHistoryChange = syncHistoryButtons;
    syncHistoryButtons();
    const isEditableTarget = (e) => {
        const target = e.target;
        const tag = target?.tagName;
        return (tag === "INPUT" || tag === "TEXTAREA" || !!target?.isContentEditable);
    };
    // Undo (Ctrl+Z / Cmd+Z, without Shift) keybind
    window.addEventListener("keydown", (e) => {
        if (e.key.toLowerCase() !== "z")
            return;
        if (!(e.ctrlKey || e.metaKey) || e.shiftKey)
            return;
        if (isEditableTarget(e))
            return;
        e.preventDefault();
        editor.undo();
    });
    // Redo (Ctrl+Y / Cmd+Y / Ctrl+Shift+Z / Cmd+Shift+Z) keybind
    window.addEventListener("keydown", (e) => {
        const key = e.key.toLowerCase();
        const isRedoKey = (key === "y" && (e.ctrlKey || e.metaKey)) ||
            (key === "z" && (e.ctrlKey || e.metaKey) && e.shiftKey);
        if (!isRedoKey)
            return;
        if (isEditableTarget(e))
            return;
        e.preventDefault();
        editor.redo();
    });
});


})();</script>
