<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCMap Editor</title>
  <!-- Bootstrap 5 Dark Mode CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --bs-body-bg: #1a1a2e;
      --bs-body-color: #eaeaea;
      --bs-primary: #0d6efd;
      --bs-secondary: #6c757d;
    }
    body { background-color: var(--bs-body-bg); color: var(--bs-body-color); }
    .sidebar { background-color: #16213e; border-right: 1px solid #2a2a4a; }
    .map-panel { background-color: #0f0f23; }
    .btn-toolbar .btn { border-radius: 0.375rem; }
    .category-header { cursor: pointer; user-select: none; }
    .category-header:hover { background-color: #2a2a4a; }
    .sprite-item { 
      display: inline-block; 
      width: 48px; 
      height: 48px; 
      margin: 2px; 
      border: 2px solid transparent; 
      border-radius: 4px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      cursor: pointer;
    }
    .sprite-item.selected { border-color: #0d6efd; box-shadow: 0 0 0 2px rgba(13,110,253,0.5); }
    .sprite-item:hover { border-color: #6c757d; }
    .sprite-item img { width: 100%; height: 100%; object-fit: contain; }
    #mapCanvas { 
      display: block; 
      cursor: crosshair; 
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .toolbar { background-color: #16213e; border-bottom: 1px solid #2a2a4a; }
    .status-bar { background-color: #16213e; border-top: 1px solid #2a2a4a; font-size: 0.875rem; }
    .modal-content { background-color: #1a1a2e; color: #eaeaea; border: 1px solid #2a2a4a; }
    .modal-header, .modal-footer { border-color: #2a2a4a; }
    .form-control, .form-select { background-color: #0f0f23; border-color: #2a2a4a; color: #eaeaea; }
    .form-control:focus, .form-select:focus { background-color: #0f0f23; border-color: #0d6efd; color: #eaeaea; box-shadow: 0 0 0 0.25rem rgba(13,110,253,0.25); }
    .search-box { width: 100%; }
    .layer-toggle .btn.active { background-color: #0d6efd; border-color: #0d6efd; }
    .zoom-display { min-width: 80px; text-align: center; }
  </style>
</head>
<body>
  <!-- Top Toolbar -->
  <div class="toolbar p-2 d-flex justify-content-between align-items-center">
    <div class="d-flex gap-2">
      <button id="btnNew" class="btn btn-sm btn-outline-light" title="New Map"><i class="bi bi-file-earmark-plus"></i></button>
      <button id="btnImport" class="btn btn-sm btn-outline-light" title="Import Map"><i class="bi bi-upload"></i></button>
      <button id="btnExport" class="btn btn-sm btn-outline-light" title="Export Map"><i class="bi bi-download"></i></button>
    </div>
    <div class="d-flex gap-2 align-items-center">
      <div class="btn-group layer-toggle" role="group">
        <input type="radio" class="btn-check" name="layer" id="layerTile" value="tile" checked autocomplete="off">
        <label class="btn btn-sm btn-outline-light" for="layerTile" title="Tile Layer"><i class="bi bi-grid-3x3-gap"></i> Tile</label>
        <input type="radio" class="btn-check" name="layer" id="layerObject" value="object" autocomplete="off">
        <label class="btn btn-sm btn-outline-light" for="layerObject" title="Object Layer"><i class="bi bi-box"></i> Object</label>
      </div>
      <div class="zoom-display text-light">
        Zoom: <span id="zoomLevel">100%</span>
      </div>
      <button id="btnZoomIn" class="btn btn-sm btn-outline-light" title="Zoom In"><i class="bi bi-zoom-in"></i></button>
      <button id="btnZoomOut" class="btn btn-sm btn-outline-light" title="Zoom Out"><i class="bi bi-zoom-out"></i></button>
      <button id="btnZoomReset" class="btn btn-sm btn-outline-light" title="Reset Zoom"><i class="bi bi-arrows-fullscreen"></i></button>
    </div>
  </div>

  <!-- Main Layout -->
  <div class="d-flex flex-1" style="height: calc(100vh - 90px);">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar d-flex flex-column" style="width: 320px; min-width: 320px; max-width: 400px; overflow: hidden;">
      <div class="p-2 border-bottom border-secondary">
        <div class="input-group input-group-sm">
          <span class="input-group-text bg-transparent border-secondary text-light"><i class="bi bi-search"></i></span>
          <input type="text" id="searchInput" class="form-control search-box bg-dark border-secondary text-light" placeholder="Search tiles/objects...">
        </div>
      </div>
      <div class="flex-1 overflow-auto" id="sidebarContent">
        <!-- Tile Picker Sections -->
        <div id="tileCategories"></div>
        <hr class="border-secondary my-2">
        <!-- Object Picker Sections -->
        <div id="objectCategories"></div>
      </div>
    </aside>

    <!-- Map Panel -->
    <main class="map-panel flex-1 d-flex flex-column position-relative" style="min-width: 0;">
      <div class="position-relative flex-1 d-flex justify-content-center align-items-center" style="min-height: 0;">
        <canvas id="mapCanvas"></canvas>
      </div>
    </main>
  </div>

  <!-- Status Bar -->
  <div class="status-bar p-2 d-flex justify-content-between align-items-center">
    <div id="statusPosition">Position: (0, 0)</div>
    <div id="statusSelection">No selection</div>
    <div id="statusMapSize">Map: 40x40</div>
  </div>

  <!-- Import Modal -->
  <div class="modal fade" id="importModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-upload"></i> Import Map</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="importCode" class="form-label">Paste Map Code (LZString compressed)</label>
            <textarea id="importCode" class="form-control" rows="8" style="font-family: monospace; font-size: 0.75rem;"></textarea>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="importReplace" checked>
            <label class="form-check-label" for="importReplace">Replace current map</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="btnImportConfirm"><i class="bi bi-check"></i> Import</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Export Modal -->
  <div class="modal fade" id="exportModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-download"></i> Export Map</h5>
          <button type="button" class class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="exportName" class="form-label">Map Name</label>
            <input type="text" id="exportName" class="form-control" value="my-map" placeholder="Enter map name">
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="exportIncludeObjects" checked>
            <label class="form-check-label" for="exportIncludeObjects">Include objects</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="btnExportConfirm"><i class="bi bi-check"></i> Export</button>
        </div>
      </div>
    </div>
  </div>

  <!-- New Map Confirmation Modal -->
  <div class="modal fade" id="newMapModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-file-earmark-plus"></i> New Map</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>Create a new map? This will replace the current map with a default grass field.</p>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="newMapConfirm" required>
            <label class="form-check-label" for="newMapConfirm">I understand this will discard unsaved changes</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="btnNewConfirm" disabled><i class="bi bi-trash"></i> Create New</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
  <script>(function() {
"use strict";
// BCMap Editor - TypeScript Source
window.BCMapEditor = window.GRASS_TILE_ID = window.MAP_HEIGHT = window.MAP_WIDTH = void 0;
const lz_string_1 = LZString;
window.MAP_WIDTH = 40;
window.MAP_HEIGHT = 40;
window.GRASS_TILE_ID = 210; // FloorExterior/Grass
class BCMapEditor {
    constructor(canvasId) {
        this.zoom = 1.0;
        this.maxZoom = 10.0;
        this.minZoom = 3.0 / 40.0; // min: 3x3 visible
        this.currentLayer = 'tile';
        this.selectedTile = null;
        this.selectedObject = null;
        this.isDragging = false;
        this.lastMousePos = { x: 0, y: 0 };
        this.panX = 0;
        this.panY = 0;
        this.isPanning = false;
        this.tileCatalog = [];
        this.objectCatalog = [];
        this.tileImageCache = new Map();
        this.objectImageCache = new Map();
        this.tileMap = new Map();
        this.objectMap = new Map();
        this.canvas = document.getElementById(canvasId);
        const ctx = this.canvas.getContext('2d');
        if (!ctx)
            throw new Error('Failed to get canvas context');
        this.ctx = ctx;
        this.mapData = this.createDefaultMap();
        this.initCatalogs();
        this.init();
        this.preloadImages();
    }
    preloadImages() {
        this.tileCatalog.forEach(tile => {
            const key = tile.Type + '/' + tile.Style;
            if (!this.tileImageCache.has(key)) {
                const img = new Image();
                img.src = 'assets/tiles/' + key + '.png';
                this.tileImageCache.set(key, img);
            }
        });
        this.objectCatalog.forEach(obj => {
            if (obj.Style === 'Blank')
                return;
            const key = obj.Type + '/' + obj.Style;
            if (!this.objectImageCache.has(key)) {
                const img = new Image();
                img.src = 'assets/objects/' + key + '.png';
                this.objectImageCache.set(key, img);
            }
        });
    }
    createDefaultMap() {
        const grassChar = String.fromCharCode(window.GRASS_TILE_ID);

        return {

        this.objectCatalog = [
            // Blank (erase)

            { ID: 500, Type: 'WallPath', Style: 'BrownDoor' },

    init() {
        this.resizeCanvas();
        this.render();
        this.canvas.addEventListener('click', this.onCanvasClick.bind(this));
        this.canvas.addEventListener('wheel', this.onCanvasWheel.bind(this));
        this.canvas.addEventListener('mousedown', this.onCanvasMouseDown.bind(this));
        this.canvas.addEventListener('mousemove', this.onCanvasMouseMove.bind(this));
        this.canvas.addEventListener('mouseup', this.onCanvasMouseUp.bind(this));
        this.canvas.addEventListener('mouseleave', this.onCanvasMouseUp.bind(this));
        window.addEventListener('resize', this.resizeCanvas.bind(this));
    }
    resizeCanvas() {
        const rect = this.canvas.parentElement?.getBoundingClientRect();
        if (rect) {
            this.canvas.width = rect.width;
            this.canvas.height = rect.height;
            this.render();
        }
    }
    getTilePosFromMouse(e) {
        const rect = this.canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const canvasWidth = this.canvas.width;
        const canvasHeight = this.canvas.height;
        const tileWidth = (canvasWidth / window.MAP_WIDTH) * this.zoom;
        const tileHeight = (canvasHeight / window.MAP_HEIGHT) * this.zoom;
        const startX = (canvasWidth - window.MAP_WIDTH * tileWidth) / 2 + this.panX;
        const startY = (canvasHeight - window.MAP_HEIGHT * tileHeight) / 2 + this.panY;
        const tileX = Math.floor((mouseX - startX) / tileWidth);
        const tileY = Math.floor((mouseY - startY) / tileHeight);
        return { X: tileX, Y: tileY };
    }
    onCanvasClick(e) {
        const pos = this.getTilePosFromMouse(e);
        if (pos.X < 0 || pos.X >= window.MAP_WIDTH || pos.Y < 0 || pos.Y >= window.MAP_HEIGHT)
            return;
        const index = pos.X + pos.Y * window.MAP_WIDTH;
        if (this.currentLayer === 'tile' && this.selectedTile) {
            this.mapData.Tiles = this.mapData.Tiles.substring(0, index) + String.fromCharCode(this.selectedTile.ID) + this.mapData.Tiles.substring(index + 1);
        }
        else if (this.currentLayer === 'object' && this.selectedObject) {
            this.mapData.Objects = this.mapData.Objects.substring(0, index) + String.fromCharCode(this.selectedObject.ID) + this.mapData.Objects.substring(index + 1);
        }
        this.render();
    }
    onCanvasWheel(e) {
        e.preventDefault();
        if (e.deltaY < 0) {
            this.zoom = Math.min(this.maxZoom, this.zoom * 1.1);
        }
        else {
            this.zoom = Math.max(this.minZoom, this.zoom * 0.9);
        }
        const zoomLevelEl = document.getElementById('zoomLevel');
        if (zoomLevelEl)
            zoomLevelEl.textContent = Math.round(this.zoom * 100) + '%';
        this.render();
    }
    onCanvasMouseDown(e) {
        this.isDragging = true;
        this.isPanning = e.button === 1 || e.button === 2 || (e.ctrlKey || e.metaKey);
        const rect = this.canvas.getBoundingClientRect();
        this.lastMousePos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        if (e.button === 2)
            e.preventDefault();
    }
    onCanvasMouseMove(e) {
        if (!this.isDragging)
            return;
        const rect = this.canvas.getBoundingClientRect();
        const currentPos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        const dx = currentPos.x - this.lastMousePos.x;
        const dy = currentPos.y - this.lastMousePos.y;
        if (this.isPanning) {
            this.panX += dx;
            this.panY += dy;
            this.render();
        }
        this.lastMousePos = currentPos;
    }
    onCanvasMouseUp() {
        this.isDragging = false;
        this.isPanning = false;
    }

            return '#8B7355';
        if (type === 'Floor')
            return '#D2691E';
        if (type === 'Wall')
            return '#808080';
        if (type === 'Water')
            return '#4169E1';
        return '#654321';
    }
    getObjectColor(type) {
        if (type.includes('Decoration'))
            return '#DAA520';

window.BCMapEditor = BCMapEditor;

"use strict";
document.addEventListener('DOMContentLoaded', () => {
    const editor = new window.BCMapEditor('mapCanvas');
    // Store editor globally
    window.editor = editor;
    editor.populatePickers();
    // Layer toggle
    const layerRadios = document.querySelectorAll('input[name="layer"]');
    layerRadios.forEach(radio => {
        radio.addEventListener('change', (e) => {
            const target = e.target;
            if (target.checked) {
                editor.setCurrentLayer(target.value);
            }
        });
    });
    // New map
    const btnNew = document.getElementById('btnNew');
    const newMapModal = new bootstrap.Modal(document.getElementById('newMapModal'));
    const newMapConfirm = document.getElementById('newMapConfirm');
    const btnNewConfirm = document.getElementById('btnNewConfirm');
    btnNew?.addEventListener('click', () => {
        newMapModal.show();
    });
    newMapConfirm?.addEventListener('change', () => {
        btnNewConfirm.disabled = !newMapConfirm.checked;
    });
    btnNewConfirm?.addEventListener('click', () => {
        editor.newMap();
        newMapModal.hide();
        newMapConfirm.checked = false;
        btnNewConfirm.disabled = true;
    });
    // Import
    const btnImport = document.getElementById('btnImport');
    const importModal = new bootstrap.Modal(document.getElementById('importModal'));
    btnImport?.addEventListener('click', () => {
        importModal.show();
    });
    const btnImportConfirm = document.getElementById('btnImportConfirm');
    const importCode = document.getElementById('importCode');
    btnImportConfirm?.addEventListener('click', () => {
        try {
            editor.importMap(importCode.value);
            importModal.hide();
            importCode.value = '';
        }
        catch (e) {
            alert(e.message);
        }
    });
    // Export
    const btnExport = document.getElementById('btnExport');
    const exportModal = new bootstrap.Modal(document.getElementById('exportModal'));
    btnExport?.addEventListener('click', () => {
        exportModal.show();
    });
    const btnExportConfirm = document.getElementById('btnExportConfirm');
    const exportName = document.getElementById('exportName');
    btnExportConfirm?.addEventListener('click', () => {
        try {
            const code = editor.exportMap(exportName.value || 'my-map');
            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${exportName.value || 'my-map'}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            exportModal.hide();
        }
        catch (e) {
            alert(e.message);
        }
    });
    // Zoom controls
    const btnZoomIn = document.getElementById('btnZoomIn');
    const btnZoomOut = document.getElementById('btnZoomOut');
    const btnZoomReset = document.getElementById('btnZoomReset');
    btnZoomIn?.addEventListener('click', () => {
        editor.zoom = Math.min(editor.maxZoom, editor.zoom * 1.1);
        const zoomLevelEl = document.getElementById('zoomLevel');
        if (zoomLevelEl)
            zoomLevelEl.textContent = Math.round(editor.zoom * 100) + '%';
        editor.render();
    });
    btnZoomOut?.addEventListener('click', () => {
        editor.zoom = Math.max(editor.minZoom, editor.zoom * 0.9);
        const zoomLevelEl = document.getElementById('zoomLevel');
        if (zoomLevelEl)
            zoomLevelEl.textContent = Math.round(editor.zoom * 100) + '%';
        editor.render();
    });
    btnZoomReset?.addEventListener('click', () => {
        editor.zoom = 1.0;
        const zoomLevelEl = document.getElementById('zoomLevel');
        if (zoomLevelEl)
            zoomLevelEl.textContent = '100%';
        editor.render();
    });
    // Search
    const searchInput = document.getElementById('searchInput');
    searchInput?.addEventListener('input', () => {
        const term = searchInput.value.toLowerCase();
        document.querySelectorAll('#tileCategories .sprite-item, #objectCategories .sprite-item').forEach(el => {
            const title = el.getAttribute('title') || '';
            const txt = el.textContent || '';
            if (title.toLowerCase().includes(term) || txt.toLowerCase().includes(term)) {
                el.style.display = '';
            }
            else {
                el.style.display = 'none';
            }
        });
    });
});
