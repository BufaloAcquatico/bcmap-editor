version: "3.8"

services:
    test:
        build:
            context: .
            dockerfile: Dockerfile.test
        # Run as the invoking host user so bind-mounted outputs
        # (playwright-report/, test-results/) are not left root-owned.
        user: "${UID:-1000}:${GID:-1000}"
        environment:
            # Numeric UIDs have no passwd entry; keep $HOME-based cache
            # writes on a writable path.
            HOME: /tmp
        volumes:
            - .:/app
            - /app/node_modules
            - /app/dist
        # Run E2E tests
        command: pnpm test:e2e
        # For debugging, uncomment below:
        # command: sleep infinity
        # Then: docker compose -f docker-compose.test.yml run test pnpm test:e2e

    # Optional: run unit tests too
    test-unit:
        build:
            context: .
            dockerfile: Dockerfile.test
        user: "${UID:-1000}:${GID:-1000}"
        environment:
            HOME: /tmp
        volumes:
            - .:/app
            - /app/node_modules
            - /app/dist
        command: pnpm test
